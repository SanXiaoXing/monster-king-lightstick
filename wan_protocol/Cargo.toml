[package]
name = "wan_protocol"
version = "0.1.0"
edition = "2021"
description = "光剑应援棒 / 演出宝宝剑 蓝牙协议与加密层（从微信小程序 mini_metalumic 移植）"

[lib]
name = "wan_protocol"
path = "src/lib.rs"

[dependencies]
# CRC32 (IEEE 802.3, 与 JS hex16StrCrc32Encryption 同款)
crc32fast = "1.4"
# AES-128-ECB + Pkcs7
aes = "0.8"
ecb = "0.1"
cipher = "0.4"
# hex / base64
hex = "0.4"
base64 = "0.22"
# Ed25519 验签 (与 tweetnacl sign.detached.verify 等价, RFC 8032)
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
# 随机数 (防伪挑战 / AES 盐)
rand = "0.8"
# thiserror
thiserror = "1"
